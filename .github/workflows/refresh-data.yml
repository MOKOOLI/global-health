name: Refresh data
# Free scheduler for the live feeds. Needs one repository secret: DATABASE_URL (the same Postgres the API uses).
on:
  schedule:
    - cron: "17 3 * * *"      # every day, 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this feed name from backend/etl/live_feeds.json (optional)"
        required: false

concurrency: { group: refresh-data, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Reference data (idempotent)
        run: python -m etl.run reference
      - name: Live feeds
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m etl.run live --only "${{ github.event.inputs.only }}"
          else
            python -m etl.run live
          fi
