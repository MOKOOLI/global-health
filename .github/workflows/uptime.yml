name: uptime
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check API readiness
        env: { SITE_URL: "${{ vars.SITE_URL }}" }
        run: |
          test -n "$SITE_URL" || { echo "Set repository variable SITE_URL"; exit 1; }
          curl -fsS --retry 3 --max-time 20 "$SITE_URL/api/health/ready"
